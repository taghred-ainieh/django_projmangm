<!DOCTYPE html>
<html lang="ar" dir="rtl"> <!-- 💡 تم التعديل لدعم اللغة العربية والاتجاه بشكل صحيح -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Project Management</title>
    
    <!-- 1. 🛠️ التصحيح: الرابط الرسمي الكامل والـ CDN الصحيح لـ Bootstrap 5.3 CSS -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    
    <!-- 2. 🛠️ التصحيح: الرابط الرسمي الكامل لأيقونات Bootstrap المفقودة عندك -->
    <link rel="stylesheet" href="https://jsdelivr.net">

    <!-- تنسيق هيكلي إجباري لضمان ثبات عناصر الصفحة والفوتر في الأسفل تماماً -->
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }
        .main-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .content-container {
            flex: 1 0 auto;
            padding: 40px 15px;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- شريط التنقل العلوي المشترك -->
        {% include 'navbar.html' %}
        
        <!-- المحتوى المتغير بالمنتصف بحواف مريحة -->
        <div class="container content-container">
             {% block content %}
             <!-- المحتوى المتغير لكل صفحة يوضع هنا تلقائياً -->
             {% endblock %}
        </div>

        <!-- الفوتر السفلي المثبت والممتد -->
        {% include 'footer.html' %}
    </div>

    <!-- 3. 🛠️ التصحيح: الرابط الرسمي الكامل لملف جافا سكريبت المسؤول عن القوائم المنسدلة والتفاعلات -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
