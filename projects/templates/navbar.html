{% load i18n %}
<style>
    /* تأثير الإضاءة السماوية الفخمة عند الضغط على مربع البحث لبدء الكتابة */
    .pms-search-field:focus {
        border-color: #38bdf8 !important;
        background-color: rgba(255, 255, 255, 0.1) !important;
        box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.15) !important;
        outline: 0;
    }
    /* تحسين لون نص التلميح ليصبح واضحاً وقابلاً للقراءة */
    .pms-search-field::placeholder {
        color: #94a3b8 !important;
        opacity: 0.8;
    }
    .pms-navbar {
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important;
        padding: 10px 20px;
        border-bottom: 2px solid #38bdf8;
    }
    .pms-nav-container {
        display: flex;
        align-items: center;
        justify-content: space-between; /* توزيع العناصر على الشاشة */
        width: 100%;
    }
    .pms-nav-right {
        display: flex;
        align-items: center;
        gap: 20px;
    }
    .pms-brand {
        color: #ffffff !important;
        font-weight: 700;
        text-decoration: none;
        font-size: 1.25rem;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .pms-nav-link {
        color: #cbd5e1 !important;
        text-decoration: none;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 6px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .pms-nav-link:hover, .pms-nav-link.active {
        color: #38bdf8 !important;
        background-color: rgba(56, 189, 248, 0.1);
    }
    
    /* 📌 تنسيق نموذج البحث الفخم الجديد */
    .pms-search-form {
        max-width: 300px;
        width: 100%;
        margin: 0;
    }
    .pms-search-input {
        background-color: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid #475569 !important;
        color: #ffffff !important;
        border-radius: 6px 0 0 6px !important; /* حواف دائرية من جهة اليسار فقط للمجموعة */
        text-align: right;
    }
    .pms-search-input:focus {
        border-color: #38bdf8 !important;
        box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.15) !important;
    }
    .pms-search-input::placeholder {
        color: #64748b;
    }
    .btn-pms-search {
        border: 1px solid #475569 !important;
        border-right: none !important;
        background-color: rgba(255, 255, 255, 0.08) !important;
        color: #38bdf8 !important;
        border-radius: 0 6px 6px 0 !important;
        padding: 0 14px;
        transition: all 0.2s;
    }
    .btn-pms-search:hover {
        background-color: rgba(56, 189, 248, 0.1) !important;
    }
</style>

<nav class="pms-navbar">
    <div class="container-fluid">
        <div class="pms-nav-container">
            
            <!-- القسم الأيمن: يحتوي على الشعار وزر الرئيسية -->
            <div class="pms-nav-right">
                <a class="pms-brand" href="{% url 'project_list' %}">
                    <i class="bi bi-kanban-fill" style="color: #38bdf8;"></i> {% trans "PROJECT MANAGEMENT" %}
                </a>
                <a class="pms-nav-link active" href="{% url 'project_list' %}">
                    <i class="bi bi-house-door-fill"></i> {% trans "Home" %}
                </a>
            </div>

            <!-- 🔍 القسم الأيسر: صندوق البحث الفخم (يرسل النص المستهدف كـ GET إلى رابط القائمة) -->
            <!-- 🔍 صندوق البحث المنسق بالكامل والمصحح للحواف العربية -->
            <form class="pms-search-form" method="GET" action="{% url 'project_list' %}" style="direction: rtl; max-width: 320px; width: 100%;">
                <div class="input-group" style="position: relative; display: flex; align-items: center;">
                    
                    <!-- أيقونة البحث (العدسة) مدمجة بشكل جمالي ثابت داخل المربع من جهة اليمين -->
                    <span class="pms-search-icon" style="position: absolute; right: 12px; z-index: 10; color: #94a3b8; pointer-events: none;">
                        <i class="bi bi-search"></i>
                    </span>

                    <!-- حقل إدخال النص: انسيابي بحواف دائرية كاملة متناسقة ومساحة داخلية مريحة -->
                    <input type="text" name="q" class="form-control pms-search-field" 
                        placeholder="{% trans 'البحث عن مشروع...' %}" 
                        value="{{ request.GET.q|default:'' }}" 
                        aria-label="Search"
                        style="width: 100%; padding: 0.55rem 2.2rem 0.55rem 1rem; font-size: 0.95rem; color: #ffffff; background-color: rgba(255, 255, 255, 0.06); border: 1px solid #475569; border-radius: 50rem; transition: all 0.25s ease; text-align: right;">

                </div>
            </form>


        </div>
    </div>
</nav>
