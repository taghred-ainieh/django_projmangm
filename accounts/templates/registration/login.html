{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<style>
    /* حاوية صندوق تسجيل الدخول المتموضع في المنتصف */
    .pms-login-box {
        max-width: 460px;
        margin: 5rem auto;
    }
    .pms-login-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        overflow: hidden;
    }
    .pms-login-header {
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        padding: 2.2rem 1.5rem;
        color: #ffffff;
        border-bottom: 2px solid #38bdf8; /* إضاءة سماوية للمشاريع */
        text-align: center;
    }
    .pms-login-header h3 {
        font-size: 1.4rem;
        font-weight: 700;
        margin-bottom: 0.4rem;
    }
    .pms-login-body {
        padding: 2.5rem 2rem;
    }

    /* 📌 السحر الهيكلي: إمساك وتجميل حقول دجانجو الافتراضية {{ form }} مباشرة من الواجهة */
    .pms-auth-form p {
        margin-bottom: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 8px;
        direction: rtl; /* اتجاه عربي متناسق */
        text-align: right;
    }
    .pms-auth-form label {
        font-weight: 600;
        color: #334155;
        font-size: 0.9rem;
    }
    .pms-auth-form input {
        display: block;
        width: 100%;
        padding: 0.65rem 1rem;
        font-size: 1rem;
        color: #1e293b;
        background-color: #ffffff;
        border: 1px solid #cbd5e1;
        /* إضافة خط جانبي كحلي فخم يتطابق تماماً مع فورم الإنشاء والتعديل */
        border-right: 4px solid #1e293b; 
        border-top-right-radius: 0rem;   
        border-bottom-right-radius: 0rem;
        border-top-left-radius: 0.375rem;
        border-bottom-left-radius: 0.375rem;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out, border-right-color 0.15s ease-in-out;
        text-align: right;
    }
    /* تأثير تركيز الإضاءة السماوية والانسيابية عند البدء بكتابة اسم الحساب */
    .pms-auth-form input:focus {
        border-color: #38bdf8;
        border-right-color: #38bdf8;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.2);
    }
    
    /* تنسيق صندوق الأخطاء الآلي (مثل كتابة كلمة مرور خاطئة) */
    .pms-auth-form .errorlist {
        list-style: none;
        padding: 10px 14px;
        margin: 0 0 1.5rem 0;
        color: #ef4444;
        background-color: rgba(239, 68, 68, 0.05);
        border: 1px solid rgba(239, 68, 68, 0.1);
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        direction: rtl;
        text-align: right;
    }

    /* زر الدخول الممتد والمضيء */
    .btn-pms-login {
        background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
        color: #0f172a !important;
        font-weight: 700;
        border: none;
        padding: 12px;
        border-radius: 8px;
        width: 100%;
        transition: all 0.25s ease;
        cursor: pointer;
        font-size: 1rem;
        margin-top: 0.5rem;
    }
    .btn-pms-login:hover {
        box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        opacity: 0.95;
    }
</style>

<div class="pms-login-box">
    <!-- استمارة شحن طلب الدخول الآمن المشفر بالـ POST للسيرفر -->
    <form method="POST" action="">
        {% csrf_token %}
        
        <div class="pms-login-card">
            <!-- رأس بطاقة الدخول -->
            <div class="pms-login-header">
                <i class="bi bi-shield-lock-fill" style="font-size: 2.5rem; color: #38bdf8;"></i>
                <h3 class="mt-2">{% trans "Log_in" %}</h3>
                <p class="small m-0" style="color: #94a3b8;">{% trans "Project_mangments" %}</p>
            </div>
            
            <!-- جسم البطاقة المفرغ بداخلها حقول الأمان تلقائياً -->
            <div class="pms-login-body">
                <div class="pms-auth-form">
                    {{ form }}
                </div>
                
                <!-- زر التنفيذ لإغلاق وتمرير البيانات -->
                <button type="submit" class="btn-pms-login shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> {% trans " log_in" %}
                </button>
            </div>
        </div>
        
    </form>
</div>
{% endblock %}
